[workspace]
resolver = "2"
members = ["core", "app", "cli"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["DotNotFact"]
repository = "https://github.com/DotNotFact/pult"
homepage = "https://github.com/DotNotFact/pult"
description = "Пульт: команды любого проекта с объяснениями, запуском, CI и уроками"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
encoding_rs = "0.8"
shell-words = "1"
include_dir = "0.7"
sha1_smol = "1"
notify = "8"
pult-core = { path = "core" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

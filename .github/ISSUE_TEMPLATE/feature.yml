name: Предложение
description: Новая возможность или улучшение
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Что мешает сейчас
      description: Опишите ситуацию, а не готовое решение. Так проще найти лучший вариант.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Как могло бы быть

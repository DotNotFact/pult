# Проверка на каждый push в main и каждый PR: база знаний, формат, clippy, тесты.
# Только Windows: окно собирается на WebView2, а Linux потребовал бы webkit2gtk - лишние минуты.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Новый push в ту же ветку отменяет прошлый прогон - его результат уже никому не нужен.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Проверка (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: База знаний - схема, ссылки, текст
        run: node knowledge/validate.mjs

      - name: Контраст палитры - текст и границы в обеих темах
        run: node tools/contrast.mjs

      - name: Состояние дерева - docs/status.md совпадает с деревом
        run: node tools/status.mjs --check

      - name: Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Кэш cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # кэш пишет только main: ветки PR его читают, но не плодят свои копии
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Формат
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Тесты
        run: cargo test --workspace

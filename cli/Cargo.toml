[package]
name = "pult-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "pult-cli"
path = "src/main.rs"

[dependencies]
pult-core.workspace = true
serde_json.workspace = true
shell-words.workspace = true
ratatui = "0.30"

# рантайм Visual C++ - внутрь exe: без него `pult` не запустится на машине без Visual C++ Redistributable
# (окно Tauri делает так же). Только для этого бинаря - глобальный +crt-static ломает proc-macro крейты.
[target.'cfg(windows)'.build-dependencies]
static_vcruntime = "3"
